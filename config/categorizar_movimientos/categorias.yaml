# ---- Ambos sentidos ----
- nombre: proveedor
  descripcion: Operaciones con un proveedor identificado por su razón social (S.L., S.A., S.C.P., ...).
  tipo_operacion: ambos
  ejemplos: Pago a proveedor / CORTÉS Y ASOCIADOS S.A.D
- nombre: suscripcion_software
  descripcion: Suscripciones, licencias y renovaciones de software, tanto pagadas como cobradas.
  tipo_operacion: ambos
  ejemplos: Cobro suscripción software; Adeudo software; Suscripción X / Renovación X
- nombre: otros
  descripcion: Cualquier movimiento que no encaje claramente en ninguna otra categoría.
  tipo_operacion: ambos
  ejemplos: Plan 238850174782; textos ambiguos o sin sentido
