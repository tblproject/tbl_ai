- nombre: seguro
  descripcion: Primas y recibos de seguros.
  tipo_operacion: pago
  ejemplos: Adeudo seguro
- nombre: gestoria
  descripcion: Honorarios de gestoría o asesoría.
  tipo_operacion: pago
  ejemplos: Adeudo gestoría
- nombre: servicios_generales
  descripcion: 'Servicios generales del local: limpieza, vigilancia, reparación de equipos.'
  tipo_operacion: pago
  ejemplos: Adeudo limpieza; Adeudo vigilancia; Pago servicio limpieza local; Pago servicio reparación
