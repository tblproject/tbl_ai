# Catálogo de categorías para clasificar movimientos (campo tipo_movimiento).
#
# Para añadir una categoría, agrega un elemento a la lista con estos campos:
#   nombre          Identificador único (sin espacios; es el valor que se guarda en tipo_movimiento).
#   descripcion     Qué agrupa la categoría. Es lo que lee Nimble, así que cuanto más claro, mejor.
#   tipo_operacion  ingreso | pago | ambos  (a qué movimientos se ofrece según el signo del importe).
#   ejemplos        Referencia para humanos; no se envía a Nimble.
#
# Reglas: nombres únicos, debe existir la categoría "otros" y el máximo es 26 (límite de Nimble).
# El script reconstruye la tabla "categorías" de DuckDB con este fichero en cada ejecución.

# ---- Ingresos ----
- nombre: soporte
  descripcion: Cobro de soporte técnico o mantenimiento recurrente de aplicaciones a clientes.
  tipo_operacion: ingreso
  ejemplos: Cobro soporte mensual; Cobro mantenimiento aplicacion
- nombre: desarrollo
  descripcion: Cobro de proyectos de desarrollo e implantación de software a clientes.
  tipo_operacion: ingreso
  ejemplos: Cobro proyecto web; Cobro desarrollo móvil; Cobro desarrollo frontend; Cobro integración API;
    Cobro implantación CRM; Cobro migración datos
- nombre: consultoria
  descripcion: Cobro de servicios de consultoría, auditoría técnica o analítica de datos.
  tipo_operacion: ingreso
  ejemplos: Cobro servicio consultoría; Cobro auditoría técnica; Cobro analítica de datos
- nombre: formacion
  descripcion: Cobro de cursos y formación impartida a empresas.
  tipo_operacion: ingreso
  ejemplos: Cobro formación corporativa
- nombre: marketing_diseno
  descripcion: Cobro de campañas de marketing y servicios de diseño a clientes.
  tipo_operacion: ingreso
  ejemplos: Cobro campañas marketing; Cobro facturación diseño
- nombre: pasarela_pago
  descripcion: Cobros recibidos a través de una pasarela de pago.
  tipo_operacion: ingreso
  ejemplos: Cobro pasarela de pago
- nombre: intereses
  descripcion: Intereses bancarios cobrados.
  tipo_operacion: ingreso
  ejemplos: Cobro intereses internacional
- nombre: nomina
  descripcion: Nómina recibida de una empresa.
  tipo_operacion: ingreso
  ejemplos: Nomina / Transferencia nomina empresa
- nombre: transferencia_recibida
  descripcion: Transferencia recibida de una persona física.
  tipo_operacion: ingreso
  ejemplos: Transferencia recibida / Hortensia Martorell Higueras
- nombre: devolucion
  descripcion: Devolución de una compra pagada con tarjeta.
  tipo_operacion: ingreso
  ejemplos: Tarjeta crédito / Devolución compra

# ---- Pagos ----
